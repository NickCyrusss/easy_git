name: Debian release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  deb:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config git dpkg-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libcurl4-openssl-dev libjson-c-dev xvfb xauth x11-utils desktop-file-utils
      - name: Configure and build
        run: |
          cmake -S . -B build-deb -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build-deb -j 4
      - name: Test and package
        run: |
          ctest --test-dir build-deb --output-on-failure
          cd build-deb
          cpack -G DEB
          test "$(dpkg-deb -f easy-git_*.deb Version)" = "${GITHUB_REF_NAME#v}"
          dpkg-deb -I easy-git_*.deb
          sudo apt-get install -y ./easy-git_*.deb
          desktop-file-validate /usr/share/applications/easy_git.desktop
          xvfb-run -a python3 ../tests/icon_smoke.py /usr/bin/easy_git
          sha256sum easy-git_*.deb > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build-deb/easy-git_*.deb build-deb/SHA256SUMS --verify-tag --title "Easy Git $GITHUB_REF_NAME" --notes-file docs/release-notes.md
