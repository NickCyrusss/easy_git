name: Debian release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v0.1.4
env:
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.1.3' }}
permissions:
  contents: write
jobs:
  deb:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config git dpkg-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libcurl4-openssl-dev libjson-c-dev xvfb xauth x11-utils desktop-file-utils
      - name: Configure and build
        run: |
          cmake -S . -B build-deb -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build-deb -j 4
      - name: Test and package
        run: |
          if ! ctest --test-dir build-deb --output-on-failure; then
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < build-deb/Testing/Temporary/LastTestsFailed.log
            grep 'FAIL:' build-deb/Testing/Temporary/LastTest.log | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            exit 1
          fi
          cd build-deb
          cpack -G DEB
          test "$(dpkg-deb -f easy-git_*.deb Version)" = "${RELEASE_TAG#v}"
          dpkg-deb -I easy-git_*.deb
          sudo apt-get install -y ./easy-git_*.deb
          desktop-file-validate /usr/share/applications/easy_git.desktop
          xvfb-run -a python3 ../tests/icon_smoke.py /usr/bin/easy_git
          sha256sum easy-git_*.deb > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build-deb/easy-git_*.deb build-deb/SHA256SUMS --clobber
            # Recreating a tag can leave its release as a draft, which anonymous
            # downloads cannot see, so publish it explicitly on every run.
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release create "$RELEASE_TAG" build-deb/easy-git_*.deb build-deb/SHA256SUMS --verify-tag --title "Easy Git $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json isDraft,tagName,assets --jq '{draft: .isDraft, tag: .tagName, assets: [.assets[].name]}'
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    # The Debian job creates the release, so this one only has to add its asset.
    needs: deb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # A stale package database makes pacman request versions the mirrors
          # no longer carry, so upgrade first instead of relying on the image.
          update: true
      - name: Install toolchain
        shell: msys2 {0}
        run: |
          pacman -S --needed --noconfirm \
            mingw-w64-ucrt-x86_64-gcc \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja \
            mingw-w64-ucrt-x86_64-pkgconf \
            mingw-w64-ucrt-x86_64-curl \
            mingw-w64-ucrt-x86_64-json-c \
            zip
      - name: Configure and build
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - name: Test
        shell: msys2 {0}
        run: |
          export PATH="/c/Program Files/Git/cmd:$PATH"
          ctest --test-dir build --output-on-failure
      - name: Assemble portable package
        shell: msys2 {0}
        run: |
          mkdir -p package
          cp build/easy_git.exe LICENSE package/
          # The executable is dynamically linked, so ship its runtime next to it.
          ldd build/easy_git.exe | awk '/ucrt64\/bin/ {print $3}' | while read -r dll; do cp "$dll" package/; done
          cd package && zip -9 ../easy_git-win64.zip ./*
      - name: Publish asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$env:RELEASE_TAG" easy_git-win64.zip --clobber
          gh release edit "$env:RELEASE_TAG" --draft=false
          # Fail the job when the asset or the published state is missing.
          gh release view "$env:RELEASE_TAG" --json isDraft,assets --jq 'if .isDraft then error("release is still a draft") else [.assets[].name] end'
