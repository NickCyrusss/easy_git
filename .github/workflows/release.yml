name: Debian release
on:
  push:
    tags: ['v*']
    branches: ['main']
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v0.1.0
env:
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.1.0' }}
permissions:
  contents: write
jobs:
  deb:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config git dpkg-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libcurl4-openssl-dev libjson-c-dev xvfb xauth x11-utils desktop-file-utils
      - name: Configure and build
        run: |
          python3 - <<'PY'
          import subprocess, tempfile, pathlib, json
          with tempfile.TemporaryDirectory() as d:
              def git(*args):
                  p = subprocess.run(['git','--literal-pathspecs','-c','core.quotepath=false','-C',d,*args],capture_output=True,text=True)
                  return [p.returncode,p.stdout,p.stderr]
              git('init'); git('config','user.name','Test'); git('config','user.email','test@example.invalid')
              pathlib.Path(d,'base').write_text('base'); git('add','.'); git('commit','-m','base')
              pathlib.Path(d,'draft').write_text('draft')
              print('::notice::'+json.dumps({'git':git('--version'),'stash':git('stash','push','-u','-m','test'),'list':git('stash','list','-z','--format=%gd%x00%H%x00%s%x00%an%x00%aI%x00%P'),'status':git('status','--porcelain') }))
          PY
          cmake -S . -B build-deb -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build-deb -j 4
      - name: Test and package
        run: |
          if ! ctest --test-dir build-deb --output-on-failure; then
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < build-deb/Testing/Temporary/LastTestsFailed.log
            grep 'FAIL:' build-deb/Testing/Temporary/LastTest.log | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            exit 1
          fi
          cd build-deb
          cpack -G DEB
          test "$(dpkg-deb -f easy-git_*.deb Version)" = "${RELEASE_TAG#v}"
          dpkg-deb -I easy-git_*.deb
          sudo apt-get install -y ./easy-git_*.deb
          desktop-file-validate /usr/share/applications/easy_git.desktop
          xvfb-run -a python3 ../tests/icon_smoke.py /usr/bin/easy_git
          sha256sum easy-git_*.deb > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build-deb/easy-git_*.deb build-deb/SHA256SUMS
          else
            gh release create "$RELEASE_TAG" build-deb/easy-git_*.deb build-deb/SHA256SUMS --verify-tag --title "Easy Git $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
